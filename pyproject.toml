[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vkover"
version = "0.1.0"
description = "VKover - VK user-bot library on web tokens (api.vk.ru, Long Poll v3)"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = ["httpx"]

[project.scripts]
vkover-login = "vkover.login:main"

[tool.hatch.build.targets.wheel]
packages = ["vkover"]
