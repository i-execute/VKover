[project]
name = "vkover"
version = "0.1.0"
description = "VKover - VK user-bot library on web tokens (api.vk.ru, Long Poll v3)"
requires-python = ">=3.10"
dependencies = ["httpx"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
vkover-login = "vkover.login:main"

[tool.setuptools]
packages = ["vkover"]
